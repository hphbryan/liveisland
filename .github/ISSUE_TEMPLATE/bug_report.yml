name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, One UI / Android version
      placeholder: Galaxy S25, One UI 8.0 / Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LiveIsland version
      description: Shown under About.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
